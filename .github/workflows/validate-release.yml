name: Validate release

# On push to main: local Hardhat/Foundry/Slither tests in parallel with
# Docker builds, then publish to ECR (web, mcp, ingest, gateway, api) tagged with
# the git SHA (immutable). Contract addresses are not applied here;
# deploy-to-production.yml publishes the deployment manifest.
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "apps/**"
      - "infra/docker/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - ".github/workflows/validate-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: validate-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  IMAGE_TAG: ${{ github.sha }}
  GITHUB_ENVIRONMENT: production

jobs:
  decide:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      contracts_changed: ${{ steps.decide.outputs.contracts_changed }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "contracts_changed=false"
            echo "contracts_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${SHA}^"
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -qE '^contracts/(contracts/|scripts/deploy/|hardhat\.config\.ts|foundry\.toml)'; then
            echo "contracts_changed=true"
            echo "contracts_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts_changed=false"
            echo "contracts_changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate release
    needs: decide
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brickbase
          POSTGRES_PASSWORD: brickbase
          POSTGRES_DB: brickbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brickbase -d brickbase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      CONTRACTS_CHANGED: ${{ needs.decide.outputs.contracts_changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --prefix apps/web --no-audit --no-fund
      - run: npm ci --prefix apps/events
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/api
            apps/events/ingest
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        if: env.CONTRACTS_CHANGED == 'true'
        with:
          python-version: "3.12"
      - name: Lint
        run: npm run lint
      - name: Hardhat tests on in-process chain
        if: env.CONTRACTS_CHANGED == 'true'
        run: npm run contracts:test
      - name: Solidity unit tests on in-process chain
        if: env.CONTRACTS_CHANGED == 'true'
        run: npm run contracts:test:unit
      - name: Hardhat integration tests on in-process chain
        if: env.CONTRACTS_CHANGED == 'true'
        run: npm run contracts:test:integration
      - name: Foundry tests on in-process chain
        if: env.CONTRACTS_CHANGED == 'true'
        run: npm run contracts:test:forge
      - name: Foundry invariant tests on in-process chain
        if: env.CONTRACTS_CHANGED == 'true'
        run: npm run contracts:test:invariant
      - name: Security checks (Slither)
        if: env.CONTRACTS_CHANGED == 'true'
        run: npm run contracts:audit
      - name: Application tests
        run: |
          EXCLUDES=contracts
          if [ "$DATABASE_URL" = "unknown" ]; then
            echo "Skipping api tests; DATABASE_URL is unknown"
            EXCLUDES=contracts,api
          fi
          npx nx run-many -t test --exclude="$EXCLUDES"

  publish-web:
    name: Build web image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-web:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.web \
            --build-arg APP_URL="${{ vars.APP_URL }}" \
            --build-arg CHAIN_ID="${{ vars.CHAIN_ID }}" \
            --build-arg RPC_URL="${{ vars.RPC_URL }}" \
            --build-arg INFURA_PROJECT_ID="${{ secrets.INFURA_PROJECT_ID }}" \
            --build-arg ASSET_VAULT_ADDRESS="${{ vars.ASSET_VAULT_ADDRESS }}" \
            --build-arg ASSET_SHARES_ADDRESS="${{ vars.ASSET_SHARES_ADDRESS }}" \
            --build-arg ORACLE_ROUTER_ADDRESS="${{ vars.ORACLE_ROUTER_ADDRESS }}" \
            --build-arg USER_ALLOWLIST_ADDRESS="${{ vars.USER_ALLOWLIST_ADDRESS }}" \
            --build-arg USDC_ADDRESS="${{ vars.USDC_ADDRESS }}" \
            --build-arg WALLETCONNECT_PROJECT_ID="${{ secrets.WALLETCONNECT_PROJECT_ID }}" \
            --build-arg WS_LIVE_URL="${{ vars.WS_LIVE_URL }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

  publish-mcp:
    name: Build mcp image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-mcp:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.mcp -t "$IMAGE" .
          docker push "$IMAGE"

  publish-ingest:
    name: Build ingest image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-ingest:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.ingest -t "$IMAGE" .
          docker push "$IMAGE"

  publish-gateway:
    name: Build gateway image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-gateway:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.gateway -t "$IMAGE" .
          docker push "$IMAGE"

  publish-api:
    name: Build api image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-api:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
