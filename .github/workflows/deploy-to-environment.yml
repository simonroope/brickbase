name: Deploy to environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: environment
      image_tag:
        description: "ECR image tag (git SHA) to deploy — leave blank to use the latest tag in ECR"
        required: false
        type: string
        default: ""
      deploy_contracts:
        description: "Deploy smart contracts (only needed when contracts have changed)"
        required: false
        type: boolean
        default: false
      contracts_network:
        description: "Hardhat network to deploy contracts to (e.g. sepolia, mainnet, baseSepolia)"
        required: false
        type: string
        default: "sepolia"

permissions:
  contents: read
  id-token: write
  actions: write

env:
  AWS_REGION: eu-west-2

jobs:
  deploy-contracts:
    if: ${{ inputs.deploy_contracts }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      asset_vault_address: ${{ steps.addresses.outputs.ASSET_VAULT_ADDRESS }}
      asset_shares_address: ${{ steps.addresses.outputs.ASSET_SHARES_ADDRESS }}
      oracle_router_address: ${{ steps.addresses.outputs.ORACLE_ROUTER_ADDRESS }}
      user_allowlist_address: ${{ steps.addresses.outputs.USER_ALLOWLIST_ADDRESS }}
      usdc_address: ${{ steps.addresses.outputs.USDC_ADDRESS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Compile contracts
        run: npx nx run contracts:compile
      - name: Deploy contracts
        working-directory: libs/contracts
        run: npx hardhat run scripts/deploy.ts --network ${{ inputs.contracts_network }}
        env:
          ETHEREUM_RPC_URL: ${{ vars.ETHEREUM_RPC_URL }}
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.CONTRACTS_DEPLOYER_PRIVATE_KEY }}
          USDC_ADDRESS: ${{ vars.USDC_ADDRESS }}
          CHAINLINK_ETH_USD_ADDRESS: ${{ vars.CHAINLINK_ETH_USD_ADDRESS }}
          CHAINLINK_USD_GBP_ADDRESS: ${{ vars.CHAINLINK_USD_GBP_ADDRESS }}
          CHAINLINK_XAU_USD_ADDRESS: ${{ vars.CHAINLINK_XAU_USD_ADDRESS }}
          CHAINLINK_FTSE100_ADDRESS: ${{ vars.CHAINLINK_FTSE100_ADDRESS }}
          ADMIN_ADDRESS: ${{ vars.ADMIN_ADDRESS }}
          ADMIN_ASSET_MANAGER_ADDRESS: ${{ vars.ADMIN_ASSET_MANAGER_ADDRESS }}
          ADMIN_COMPLIANCE_ADDRESS: ${{ vars.ADMIN_COMPLIANCE_ADDRESS }}
      - name: Capture deployed addresses
        id: addresses
        run: |
          FILE="libs/contracts/deploy/${{ inputs.contracts_network }}-addresses.json"
          if [ ! -f "$FILE" ]; then
            echo "Address file not found: $FILE"
            exit 1
          fi
          cat "$FILE"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$FILE" >> $GITHUB_OUTPUT
      - name: Update GitHub Environment variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="libs/contracts/deploy/${{ inputs.contracts_network }}-addresses.json"
          ENV="${{ inputs.environment }}"
          REPO="${{ github.repository }}"
          for KEY in ASSET_VAULT_ADDRESS ASSET_SHARES_ADDRESS ORACLE_ROUTER_ADDRESS USER_ALLOWLIST_ADDRESS USDC_ADDRESS; do
            VALUE=$(jq -r --arg k "$KEY" '.[$k]' "$FILE")
            if [ -n "$VALUE" ] && [ "$VALUE" != "null" ]; then
              gh variable set "$KEY" --env "$ENV" --repo "$REPO" --body "$VALUE"
              echo "Updated $KEY=$VALUE in $ENV environment"
            fi
          done

  deploy-ecs:
    needs: deploy-contracts
    if: ${{ always() && (needs.deploy-contracts.result == 'success' || needs.deploy-contracts.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve image tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV
          else
            TAG=$(aws ecr describe-images \
              --repository-name brickbase-web \
              --region ${{ env.AWS_REGION }} \
              --query 'sort_by(imageDetails, &imagePushedAt)[-1].imageTags[0]' \
              --output text)
            echo "Resolved latest ECR tag: $TAG"
            echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          fi
      - run: make -C infra/production deploy wait-stable
        env:
          IMAGE_ACC: ${{ vars.ECR_REGISTRY_ID }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          REDIS_URL: ${{ vars.REDIS_URL }}
          APP_URL: ${{ vars.APP_URL }}
          SSM_INFURA_ARN: ${{ vars.SSM_INFURA_ARN }}
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          ETHEREUM_RPC_URL: ${{ vars.ETHEREUM_RPC_URL }}
          ASSET_VAULT_ADDRESS: ${{ needs.deploy-contracts.outputs.asset_vault_address || vars.ASSET_VAULT_ADDRESS }}
          ASSET_SHARES_ADDRESS: ${{ needs.deploy-contracts.outputs.asset_shares_address || vars.ASSET_SHARES_ADDRESS }}
          ORACLE_ROUTER_ADDRESS: ${{ needs.deploy-contracts.outputs.oracle_router_address || vars.ORACLE_ROUTER_ADDRESS }}
          USER_ALLOWLIST_ADDRESS: ${{ needs.deploy-contracts.outputs.user_allowlist_address || vars.USER_ALLOWLIST_ADDRESS }}
          USDC_ADDRESS: ${{ needs.deploy-contracts.outputs.usdc_address || vars.USDC_ADDRESS }}
