name: Production build and deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint --prefix apps/web --if-present
      - run: npx nx run web:test --skip-nx-cache
      - run: npm ci --prefix apps/events
      - run: npx nx run events:test --skip-nx-cache

  publish-web:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -f infra/docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_CHAIN_ID="${{ vars.NEXT_PUBLIC_CHAIN_ID }}" \
            --build-arg NEXT_PUBLIC_RPC_URL="${{ vars.NEXT_PUBLIC_RPC_URL }}" \
            --build-arg NEXT_PUBLIC_ASSET_VAULT_ADDRESS="${{ vars.NEXT_PUBLIC_ASSET_VAULT_ADDRESS }}" \
            --build-arg NEXT_PUBLIC_ASSET_SHARES_ADDRESS="${{ vars.NEXT_PUBLIC_ASSET_SHARES_ADDRESS }}" \
            --build-arg NEXT_PUBLIC_ORACLE_ROUTER_ADDRESS="${{ vars.NEXT_PUBLIC_ORACLE_ROUTER_ADDRESS }}" \
            --build-arg NEXT_PUBLIC_USER_ALLOWLIST_ADDRESS="${{ vars.NEXT_PUBLIC_USER_ALLOWLIST_ADDRESS }}" \
            --build-arg NEXT_PUBLIC_USDC_ADDRESS="${{ vars.NEXT_PUBLIC_USDC_ADDRESS }}" \
            --build-arg NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID="${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_WS_LIVE_URL="${{ vars.NEXT_PUBLIC_WS_LIVE_URL }}" \
            -t "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-web:${{ github.sha }}" .
          docker push "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-web:${{ github.sha }}"

  publish-mcp:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -f infra/docker/Dockerfile.mcp \
            -t "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-mcp:${{ github.sha }}" .
          docker push "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-mcp:${{ github.sha }}"

  publish-ingest:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -f infra/docker/Dockerfile.ingest \
            -t "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-ingest:${{ github.sha }}" .
          docker push "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-ingest:${{ github.sha }}"

  publish-gateway:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -f infra/docker/Dockerfile.gateway \
            -t "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-gateway:${{ github.sha }}" .
          docker push "${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-gateway:${{ github.sha }}"

  deploy:
    needs:
      - publish-web
      - publish-mcp
      - publish-ingest
      - publish-gateway
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: make -C infra/production deploy wait-stable
        env:
          IMAGE_ACC: ${{ vars.ECR_REGISTRY_ID }}
          IMAGE_TAG: ${{ github.sha }}
          EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          REDIS_URL: ${{ vars.REDIS_URL }}
          PRODUCTION_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SSM_INFURA_ARN: ${{ vars.SSM_INFURA_ARN }}
