name: Publish images to ECR

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "contracts/abi/**"
      - "infra/docker/**"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
  workflow_dispatch:
  workflow_call:
    inputs:
      asset_vault_address:
        description: "AssetVault address to bake into images (after a contract deploy)"
        type: string
        required: false
        default: ""
      asset_shares_address:
        description: "AssetShares address to bake into images (after a contract deploy)"
        type: string
        required: false
        default: ""
      oracle_router_address:
        description: "OracleRouter address to bake into images (after a contract deploy)"
        type: string
        required: false
        default: ""
      user_allowlist_address:
        description: "AssetUserAllowList address to bake into images (after a contract deploy)"
        type: string
        required: false
        default: ""
      usdc_address:
        description: "USDC address to bake into images (after a contract deploy)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-2
  IMAGE_TAG: ${{ github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${SHA}^"
          fi
          # Deploy-contracts owns source/deploy changes and calls this workflow after vars are written.
          if git diff --name-only "$BEFORE" "$SHA" | grep -qE '^contracts/(contracts/|scripts/deploy/|hardhat\.config\.ts|foundry\.toml)'; then
            echo "Contract sources changed; skipping until deploy-contracts publishes with new addresses"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/api
            apps/events/ingest
      - run: npm run lint

  publish-web:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-web:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.web \
            --build-arg APP_URL="${{ vars.APP_URL }}" \
            --build-arg CHAIN_ID="${{ vars.CHAIN_ID }}" \
            --build-arg RPC_URL="${{ vars.RPC_URL }}" \
            --build-arg INFURA_PROJECT_ID="${{ secrets.INFURA_PROJECT_ID }}" \
            --build-arg ASSET_VAULT_ADDRESS="${{ inputs.asset_vault_address || vars.ASSET_VAULT_ADDRESS }}" \
            --build-arg ASSET_SHARES_ADDRESS="${{ inputs.asset_shares_address || vars.ASSET_SHARES_ADDRESS }}" \
            --build-arg ORACLE_ROUTER_ADDRESS="${{ inputs.oracle_router_address || vars.ORACLE_ROUTER_ADDRESS }}" \
            --build-arg USER_ALLOWLIST_ADDRESS="${{ inputs.user_allowlist_address || vars.USER_ALLOWLIST_ADDRESS }}" \
            --build-arg USDC_ADDRESS="${{ inputs.usdc_address || vars.USDC_ADDRESS }}" \
            --build-arg WALLETCONNECT_PROJECT_ID="${{ secrets.WALLETCONNECT_PROJECT_ID }}" \
            --build-arg WS_LIVE_URL="${{ vars.WS_LIVE_URL }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

  publish-mcp:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-mcp:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.mcp -t "$IMAGE" .
          docker push "$IMAGE"

  publish-ingest:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-ingest:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.ingest -t "$IMAGE" .
          docker push "$IMAGE"

  publish-gateway:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-gateway:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.gateway -t "$IMAGE" .
          docker push "$IMAGE"

  publish-api:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AUTOMATED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="${{ vars.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/brickbase-api:${{ env.IMAGE_TAG }}"
          docker build -f infra/docker/Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
