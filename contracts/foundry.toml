# Foundry configuration for Brickbase contracts
# Hybrid setup: Foundry for Solidity tests/fuzzing, Hardhat for deployments/TypeScript

[profile.default]
# Source paths
src = "contracts"
test = "tests"
script = "scripts"
out = "artifacts-forge"
libs = ["../node_modules", "lib"]
cache_path = "cache-forge"

# Solidity compiler settings (match Hardhat)
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"

# Remappings
remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@contracts/=contracts/",
]

# Test settings
ffi = false
verbosity = 2
gas_reports = ["AssetVault", "AssetShares", "AssetUserAllowList", "OracleRouter"]

# Fuzz testing
[fuzz]
runs = 1000
max_test_rejects = 65536
seed = "0x1234"
dictionary_weight = 40

# Invariant testing
[invariant]
runs = 256
depth = 128
fail_on_revert = false
call_override = false
dictionary_weight = 80
shrink_run_limit = 5000

# Formatter
[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "attributes_first"
number_underscore = "thousands"
quote_style = "double"
single_line_statement_blocks = "preserve"
tab_width = 4
wrap_comments = true
